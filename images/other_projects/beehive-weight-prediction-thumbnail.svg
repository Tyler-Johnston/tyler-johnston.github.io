<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Beehive Weight Prediction</title>
  <desc id="desc">Editorial chart thumbnail showing YOLO validation accuracy on BEE4 bee/no-bee image classification climb from 54.20% (default SGD config, 3 epochs) to 97.60% (tuned Adam config, 30 epochs) to 98.40% (best Adam config, 75 epochs).</desc>
  <defs>
    <pattern id="paperGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#3B2412" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#241505" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="820" fill="#F5E6C9"/>
  <rect width="1600" height="820" fill="url(#paperGrid)"/>
  <rect x="0" y="0" width="30" height="820" fill="#3C2412"/>

  <!-- Title block -->
  <text x="94" y="136" fill="#2B1B0E" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2">Beehive Weight</text>
  <text x="94" y="205" fill="#2B1B0E" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2">Prediction</text>
  <path d="M97 239H577" stroke="#3C2412" stroke-width="5"/>
  <text x="96" y="281" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.7">BEE4 IMAGE CLASSIFICATION &#183; YOLO VALIDATION ACCURACY</text>

  <!-- Axis: validation accuracy, 0 to 100% -->
  <text x="562" y="365" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0.7">ACCURACY</text>
  <line x1="640" y1="390" x2="640" y2="665" stroke="#2B1B0E" stroke-width="3"/>
  <line x1="640" y1="390" x2="1490" y2="390" stroke="#2B1B0E" stroke-opacity="0.20" stroke-width="2"/>
  <line x1="640" y1="458.75" x2="1490" y2="458.75" stroke="#2B1B0E" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="640" y1="527.5" x2="1490" y2="527.5" stroke="#2B1B0E" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="640" y1="596.25" x2="1490" y2="596.25" stroke="#2B1B0E" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="640" y1="665" x2="1490" y2="665" stroke="#2B1B0E" stroke-width="3"/>
  <text x="612" y="397" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">100%</text>
  <text x="612" y="466" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">75%</text>
  <text x="612" y="535" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">50%</text>
  <text x="612" y="603" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">25%</text>
  <text x="612" y="672" fill="#7A5A2E" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">0%</text>

  <!-- Three YOLO configurations; tuning the optimizer/epochs lifts accuracy from near-chance to near-perfect -->
  <g filter="url(#softShadow)">
    <rect x="705" y="515.95" width="170" height="149.05" fill="#C9B79A"/>
    <rect x="975" y="396.6" width="170" height="268.4" fill="#D98E04"/>
    <rect x="1245" y="394.4" width="170" height="270.6" fill="#D98E04"/>
  </g>
  <text x="790" y="492" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">54.20%</text>
  <text x="1060" y="373" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="54" font-weight="800" text-anchor="middle">97.60%</text>
  <text x="1330" y="371" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="54" font-weight="800" text-anchor="middle">98.40%</text>

  <!-- Configuration labels -->
  <text x="705" y="705" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">DEFAULT</text>
  <text x="705" y="734" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">SGD &#183; 3 EPOCHS</text>

  <text x="975" y="705" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">TUNED</text>
  <text x="975" y="734" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">ADAM &#183; 30 EPOCHS</text>

  <text x="1245" y="705" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">BEST</text>
  <text x="1245" y="734" fill="#2B1B0E" font-family="Arial, sans-serif" font-size="22" font-weight="700">ADAM &#183; 75 EPOCHS</text>

</svg>
